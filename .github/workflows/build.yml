name: Build Automatic File Sorter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Windows Executable
        run: |
          pyinstaller --onefile --windowed --icon=assets/icons/icon.ico --name "Automatic File Sorter" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automatic-File-Sorter-Windows
          path: dist/*.exe

  macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller pillow

      - name: Build macOS Application
        run: |
          pyinstaller --onefile --windowed --icon=assets/icons/icon.icns --name "Automatic File Sorter" main.py

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automatic-File-Sorter-macOS
          path: dist/*
